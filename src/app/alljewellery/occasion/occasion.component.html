

<h1 class="text-center">Occasion</h1>
<div class="container">
    <div class="row">
        <div class="col-md-4 g-5" *ngFor="let o of officeware">
            <div class="card">
                <div class="card-header">
                    <img [src]="o.officewareImage"height="400" width="350" alt="">
                </div>
                <div class="card-body">
                    <h2 class="text-center">{{o.officewareName}}</h2>
                       
                </div>
                <div class="card-footer text-center">
                     <button class="btn btn-success"> Wishlist</button>
                     
                 
                </div>
            </div>
        </div>
    </div>
</div>
