<div class="view-products-container">
  <div class="page-header">
    <h1><i class="fa fa-gem"></i> View All Products</h1>
    <p>Browse and manage your jewellery collection</p>
  </div>
  
  <div class="products-grid" *ngIf="jewellery && jewellery.length > 0">
    <div class="product-card" *ngFor="let j of jewellery">
      <div class="card-image-wrapper">
        <img [src]="j.productImage" alt="{{j.productName}}" class="card-image">
        <div class="image-overlay"></div>
      </div>
      <div class="card-content">
        <h3 class="product-name">{{j.productName}}</h3>
        <p class="product-description">{{j.productDescription}}</p>
        <div class="product-price">
          <span class="price-label">Price:</span>
          <span class="price-value">{{j.productPrice | currency:'INR'}}</span>
        </div>
        <div class="product-category">
          <i class="fa fa-tag"></i> {{j.productCategory}}
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-icon wishlist-btn">
          <i class="fa fa-heart"></i>
          <span>Wishlist</span>
        </button>
        <button class="btn-icon cart-btn">
          <i class="fa fa-shopping-cart"></i>
          <span>Buy Now</span>
        </button>
      </div>
    </div>
  </div>
  
  <div class="empty-state" *ngIf="!jewellery || jewellery.length === 0">
    <i class="fa fa-inbox"></i>
    <h3>No Products Available</h3>
    <p>Add products to start building your collection</p>
  </div>
</div>
