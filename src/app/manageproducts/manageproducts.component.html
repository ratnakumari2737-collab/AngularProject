<div class="manage-products-container">
  <div class="page-header">
    <h1><i class="fa fa-cog"></i> Manage Products</h1>
    <p>Update and manage your jewellery products</p>
  </div>
  
  <div class="products-grid" *ngIf="jewellery && jewellery.length > 0">
    <div class="product-card" *ngFor="let j of jewellery">
      <div class="card-image-wrapper">
        <img [src]="j.productImage" alt="{{j.productName}}" class="card-image">
        <div class="image-overlay"></div>
      </div>
      <div class="card-content">
        <h3 class="product-name">{{j.productName}}</h3>
        <p class="product-description">{{j.productDescription}}</p>
        <div class="product-price">
          <span class="price-label">Price:</span>
          <span class="price-value">{{j.productPrice | currency:'INR'}}</span>
        </div>
        <div class="product-category">
          <i class="fa fa-tag"></i> {{j.productCategory}}
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-icon update-btn" (click)="updatenow(j)" data-bs-toggle="modal" data-bs-target="#updatemodal">
          <i class="fa fa-edit"></i>
          <span>Update</span>
        </button>
        <button class="btn-icon delete-btn" (click)="deleteit(j.productId)">
          <i class="fa fa-trash"></i>
          <span>Delete</span>
        </button>
      </div>
    </div>
  </div>
  
  <div class="empty-state" *ngIf="!jewellery || jewellery.length === 0">
    <i class="fa fa-inbox"></i>
    <h3>No Products Available</h3>
    <p>Add products to start managing your collection</p>
  </div>
</div>

<!-- Update Modal -->
<div class="modal fade" id="updatemodal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title">
          <i class="fa fa-edit"></i> Update Product
        </h1>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="updateProductId" class="form-label">
            <i class="fa fa-hashtag"></i> Product ID
          </label>
          <input 
            type="text" 
            id="updateProductId" 
            class="form-control" 
            [(ngModel)]="updated.productId"
            readonly
          >
        </div>
        
        <div class="form-group">
          <label for="updateProductName" class="form-label">
            <i class="fa fa-tag"></i> Product Name
          </label>
          <input 
            type="text" 
            id="updateProductName" 
            class="form-control" 
            [(ngModel)]="updated.productName"
          >
        </div>
        
        <div class="form-group">
          <label for="updateProductDesc" class="form-label">
            <i class="fa fa-align-left"></i> Product Description
          </label>
          <textarea 
            id="updateProductDesc" 
            class="form-control" 
            [(ngModel)]="updated.productDescription"
            rows="3"
          ></textarea>
        </div>
        
        <div class="form-group">
          <label for="updateProductPrice" class="form-label">
            <i class="fa fa-rupee-sign"></i> Product Price
          </label>
          <input 
            type="text" 
            id="updateProductPrice" 
            class="form-control" 
            [(ngModel)]="updated.productPrice"
          >
        </div>
        
        <div class="form-group">
          <label for="updateProductImage" class="form-label">
            <i class="fa fa-image"></i> Product Image URL
          </label>
          <input 
            type="text" 
            id="updateProductImage" 
            class="form-control" 
            [(ngModel)]="updated.productImage"
          >
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" data-bs-dismiss="modal" (click)="submitproduct()">
          <i class="fa fa-save"></i> Update Product
        </button>
      </div>
    </div>
  </div>
</div>
