<div class="wishlist-container">
  <div class="wishlist-header">
    <h1><i class="fa fa-heart"></i> My Wishlist</h1>
    <p>Your favorite jewellery items</p>
  </div>

  <!-- Wishlist Items -->
  <div class="wishlist-content" *ngIf="wishitems && wishitems.length > 0">
    <div class="wishlist-grid">
      <div class="wishlist-item" *ngFor="let wish of wishitems; let i = index">
        <div class="item-image-wrapper">
          <img [src]="wish.productImage" alt="{{ wish.productName }}" class="item-image">
          <div class="image-overlay"></div>
        </div>
        <div class="item-content">
          <h3 class="item-name">{{ wish.productName }}</h3>
          <p class="item-description">{{ wish.productDescription }}</p>
          <div class="item-price-section">
            <span class="price-label">Price:</span>
            <span class="price-value">{{ wish.productPrice | currency:'INR' }}</span>
          </div>
          <div class="item-actions">
            <button class="btn-remove" (click)="removeItem(wish)">
              <i class="fa fa-trash"></i> Remove
            </button>
            <button class="btn-add-to-cart" (click)="addnow(wish)">
              <i class="fa fa-shopping-cart"></i> Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!wishitems || wishitems.length === 0">
    <i class="fa fa-heart"></i>
    <h2>Your Wishlist is Empty</h2>
    <!-- <p>You haven't added any items to your wishlist yet. Start exploring to find your favorite jewellery!</p> -->
    <button class="btn-shop" routerLink="/user/products">
      <i class="fa fa-gem"></i> Explore Products
    </button>
  </div>
</div>
