<div class="orders-container">
  <div class="orders-header">
    <h1><i class="fa fa-list-alt"></i> My Orders</h1>
    <p>Track all your jewellery orders</p>
  </div>

  <div class="orders-content" *ngIf="list && list.length > 0">
    <div class="order-card" *ngFor="let o of list; let i = index">
      <div class="order-header">
        <div class="order-number">
          <i class="fa fa-shopping-bag"></i>
          <span>Order #{{i + 1}}</span>
        </div>
        <div class="order-status">
          <span class="status-badge">
            <i class="fa fa-clock"></i> Processing
          </span>
        </div>
      </div>

      <div class="order-details">
        <div class="product-info">
          <h3>{{o.productName}}</h3>
          <p class="product-description">{{o.productDescription}}</p>
        </div>

        <div class="info-row">
          <div class="info-item">
            <i class="fa fa-map-marker-alt"></i>
            <div class="info-content">
              <span class="info-label">Delivery Address</span>
              <span class="info-value">{{o.address}}</span>
            </div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-item">
            <i class="fa fa-phone"></i>
            <div class="info-content">
              <span class="info-label">Contact Number</span>
              <span class="info-value">{{o.phone}}</span>
            </div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-item">
            <i class="fa fa-user"></i>
            <div class="info-content">
              <span class="info-label">Ordered By</span>
              <span class="info-value">{{o.username}}</span>
            </div>
          </div>
        </div>

        <div class="order-footer">
          <div class="order-price">
            <span class="price-label">Total Amount:</span>
            <span class="price-value">{{o.productPrice | currency:'INR'}}</span>
          </div>
          <div class="order-actions">
            <button class="btn-track">
              <i class="fa fa-truck"></i> Track Order
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="!list || list.length === 0">
    <i class="fa fa-inbox"></i>
    <h2>No Orders Yet</h2>
    <!-- <p>You haven't placed any orders. Start shopping to see your orders here!</p> -->
    <button class="btn-shop" routerLink="/user/products">
      <i class="fa fa-shopping-bag"></i> Start Shopping
    </button>
  </div>
</div>
